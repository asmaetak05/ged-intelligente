<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GED Intelligente | Tableau de bord</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blob blob-1"></div>
    <div class="background-blob blob-2"></div>
    
    <div class="container">
        <header>
            <h1>GED <span>Intelligente</span></h1>
            <p>Tableau de bord des Marchés Publics extraits par l'IA</p>
        </header>
        
        <div class="dashboard-stats">
            <div class="stat-card">
                <h3>Appels d'Offres Traités</h3>
                <p id="total-ao">0</p>
            </div>
            <div class="stat-card">
                <h3>Précision IA</h3>
                <p id="total-docs">98%</p>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Rechercher par objet, province ou N° d'ordre...">
        </div>
        
        <div id="ao-grid" class="grid">
            <div class="loading">Connexion à l'Intelligence Artificielle...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
